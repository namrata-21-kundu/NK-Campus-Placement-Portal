<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Registration - Placement Portal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar">
        <a href="index.html" class="brand">Campus Placement Portal</a>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="jobs">Browse Jobs</a>
            <a href="login.html">Student Login</a>
            <a href="admin-login.html">Admin Login</a>
        </div>
    </nav>

    <div class="container">
        <div class="form-card">
            <div style="text-align: center; margin-bottom: 1.5rem;">
                <span class="badge badge-shortlisted" style="font-size: 0.85rem; padding: 0.35rem 0.8rem;">Placement Officer / Admin</span>
                <h1 style="margin-top: 0.75rem;">Administrator Registration</h1>
            </div>

            <form action="admin-register" method="post">

                <div class="form-group">
                    <label for="name">Full Name / Officer Name:</label>
                    <input type="text" id="name" name="name" placeholder="e.g. Dr. John Doe" required>
                </div>

                <div class="form-group">
                    <label for="email">Admin Email Address:</label>
                    <input type="email" id="email" name="email" placeholder="admin@example.com" required>
                </div>

                <div class="form-group">
                    <label for="password">Password:</label>
                    <input type="password" id="password" name="password" placeholder="Create administrator password" required>
                </div>

                <button type="submit" class="btn btn-secondary btn-block">Register Administrator</button>
            </form>

            <p style="text-align: center; margin-top: 1.25rem; font-size: 0.95rem; color: var(--text-muted);">
                Already have an admin account? <a href="admin-login.html" style="color: var(--sky-primary); font-weight: 600;">Admin Login</a>
            </p>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Student Placement Management System</p>
    </footer>

</body>
</html>
