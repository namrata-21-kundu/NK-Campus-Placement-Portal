<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login - Placement Portal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar">
        <a href="index.html" class="brand">Campus Placement Portal</a>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="jobs">Browse Jobs</a>
            <a href="login.html">Student Login</a>
            <a href="admin-login.html">Admin Login</a>
        </div>
    </nav>

    <div class="container">
        <div class="form-card">
            <h1>Student Login</h1>
            <form action="login" method="post">

                <div class="form-group">
                    <label for="email">Email Address:</label>
                    <input type="email" id="email" name="email" placeholder="name@example.com" required>
                </div>

                <div class="form-group">
                    <label for="password">Password:</label>
                    <input type="password" id="password" name="password" placeholder="Enter your password" required>
                </div>

                <button type="submit" class="btn btn-primary btn-block">Login</button>
            </form>

            <p style="text-align: center; margin-top: 1.25rem; font-size: 0.95rem; color: var(--text-muted);">
                Don't have an account? <a href="register.html" style="color: var(--primary); font-weight: 600;">Register here</a>
            </p>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Student Placement Management System</p>
    </footer>

</body>
</html>
